services:
  - type: web
    name: grafica3d
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TELEGRAPH_TOKEN
        sync: false
      - key: DB_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
