services:
  - type: web
    name: grafica3d
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /pedido
        destination: /pedido.html
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /financeiro
        destination: /financeiro.html
