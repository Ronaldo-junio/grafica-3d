<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Gráfica3D · Minha conta</title><script src="shared.js"></script>
<style>.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.stt{display:inline-block;padding:2px 10px;border-radius:999px;color:#08121a;font-weight:700;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pr{font-size:20px;font-weight:700}</style></head><body><main><div id="box"></div></main>
<script>shell('conta');const U=getUser(),box=$('#box');
function lista(d){return d.pedidos.length?`<div class="ls">`+d.pedidos.map(p=>`<div class="card"><div class="row" style="justify-content:space-between"><b>Pedido #${p.id}</b><span class="stt" style="background:${SC[p.st]||'#ccc'}">${esc(p.st)}</span></div><div style="margin:6px 0">${esc(p.desc)}</div><div class="row"><span class="pr">${brl(p.total)}</span><span class="${p.pago?'ok':''}">${p.pago?'Pago ✓':'Aguardando pagamento'}</span></div><small style="color:var(--m)">${p.prazo?'Prazo: '+p.prazo.split('-').reverse().join('/')+' · ':''}feito em ${p.d.split('-').reverse().join('/')}</small></div>`).join('')+`</div>`:'<div class="card">Você ainda não fez pedidos com esta conta. <a href="pedido.html">Fazer um pedido</a></div>'}
function tela(d){box.innerHTML=`<h1>Olá, ${esc(d.nome.split(' ')[0])}!</h1><p style="color:var(--m)">${esc(d.nome)} · WhatsApp ${esc(d.tel)}</p><div class="row" style="margin-bottom:6px"><button id="nt" hidden>🔔 Ativar avisos neste aparelho</button><button id="sx">Sair da conta</button></div><h2>Meus pedidos</h2><div id="ped">${lista(d)}</div>`;
 $('#sx').onclick=sairConta;const nt=$('#nt');if('Notification' in window&&Notification.permission=='default'){nt.hidden=false;nt.onclick=()=>Notification.requestPermission().then(()=>nt.hidden=true)}}
if(!CT()){box.innerHTML='<h1>Entrar ou criar conta</h1><p style="color:var(--m)">Com uma conta, seus dados já vêm preenchidos no pedido e você acompanha o andamento aqui. É opcional.</p><div class="card" style="max-width:420px" id="fb"></div>';authForm($('#fb'),()=>location.href='index.html')}
else{const r=capi('GET','/api/conta');if(r.s==401){localStorage.removeItem('g3d_ct');location.reload()}else{tela(r.j);watchMine(d=>{$('#ped').innerHTML=lista(d)},true)}}</script></body></html>
