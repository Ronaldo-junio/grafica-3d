<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Gráfica3D · Admin</title><script src="shared.js"></script></head><body><main>
<h1>Painel administrativo</h1><div class="k" id="k"></div>
<h2>Pedidos</h2><div id="imp" class="card" hidden style="margin-bottom:10px"><b>Importar pedidos anteriores (Oficina 3D)</b><p style="margin:6px 0;color:var(--m)">25 pedidos, com clientes, prazos, valores e status. Só pode ser feito uma vez.</p><button class="p" onclick="imp()">Importar 25 pedidos</button></div><div class="card w"><table><thead><tr><th>#</th><th>Cliente</th><th>Itens</th><th>Prazo</th><th>Total</th><th>Status</th></tr></thead><tbody id="tp"></tbody></table></div>
<h2>Estoque da loja</h2><div class="card w"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Ajustar</th></tr></thead><tbody id="tl"></tbody></table></div>
<h2>Estoque de material</h2><div class="card w"><table><thead><tr><th>Material</th><th>Saldo (kg)</th><th>Mínimo</th><th>Reposição</th></tr></thead><tbody id="tm"></tbody></table></div></main>
<script>const IMP=[{"cli":"Letícia Tavares","desc":"Dragão Banguela ×1","prazo":"2026-10-30","total":20,"st":"Pronto","entrega":"Retirada"},{"cli":"Laura","desc":"Shitzu chaveiro ×1","prazo":"2026-11-05","total":20,"st":"Acabamento","entrega":"Retirada"},{"cli":"Vanelsa","desc":"Dragão Banguela ×2","prazo":"2026-10-31","total":40,"st":"Novo","entrega":"Retirada"},{"cli":"Maria Clara","desc":"Gato suporte de oculos ×1","prazo":"2026-10-31","total":70,"st":"Novo","entrega":"Retirada"},{"cli":"Ana Paula","desc":"Dragão Banguela ×2","prazo":"2026-10-30","total":40,"st":"Novo","entrega":"Retirada"},{"cli":"Ana Paula","desc":"Capivara ×2","prazo":"2026-10-20","total":40,"st":"Enviado","entrega":"Retirada"},{"cli":"Paula","desc":"Capivara ×1","prazo":"2026-10-20","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Adriano","desc":"Banguela ×1","prazo":"2026-10-20","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Luciene","desc":"ART figure Frozen ×1","prazo":"2026-10-28","total":20,"st":"Novo","entrega":"Retirada"},{"cli":"Luciene","desc":"Dragão Banguela ×1","prazo":"2026-10-28","total":20,"st":"Novo","entrega":"Retirada"},{"cli":"Ariane Alessandra","desc":"Chaveiro capivara ×1","prazo":"2026-10-20","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Letícia Tavares","desc":"Jesus sentadinho ×1","prazo":"2026-10-28","total":15,"st":"Acabamento","entrega":"Retirada"},{"cli":"Ariane alessandra","desc":"Trono game off trones ×1","prazo":"2026-10-30","total":0,"st":"Novo","entrega":"Retirada"},{"cli":"Luiz","desc":"Tartaruga ×1","prazo":"2026-10-30","total":0,"st":"Novo","entrega":"Retirada"},{"cli":"Jaqueline","desc":"Dinossauro articulado ×1","prazo":"2026-10-30","total":0,"st":"Novo","entrega":"Retirada"},{"cli":"Luana frios","desc":"Dragão Banguela brsnco ×1","prazo":"2026-10-14","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Luana frios","desc":"Dragão Banguela ×1","prazo":"2026-10-14","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Daiane","desc":"Dragão Banguela ×1","prazo":"2026-10-10","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Karol","desc":"Fez tubarão sortido grande ×1","prazo":"2026-10-30","total":0,"st":"Novo","entrega":"Retirada"},{"cli":"Ariane alessandra","desc":"Dragão Banguela ×1","prazo":"2026-10-13","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Vanessa","desc":"Imã geladeira dragao ×1","prazo":"2026-10-08","total":8,"st":"Enviado","entrega":"Retirada"},{"cli":"Vanessa","desc":"ART figure Tem Rezero pintada ×1","prazo":"2026-10-08","total":30,"st":"Enviado","entrega":"Retirada"},{"cli":"Vanessa","desc":"Dragão Banguela ×1","prazo":"2026-10-08","total":20,"st":"Enviado","entrega":"Retirada"},{"cli":"Jéssica P.","desc":"Dragão Banguela ×2","prazo":"2026-10-10","total":40,"st":"Entregue","entrega":"Retirada"},{"cli":"Jéssica S.","desc":"Dragão Banguela ×1","prazo":"2026-10-08","total":20,"st":"Entregue","entrega":"Retirada"}];
function imp(){if(!confirm('Importar 25 pedidos?'))return;const r=api('POST','/api/admin/pedidos/importar',{lote:'oficina3d',pedidos:IMP});if(r.s!=200)return alert(r.j.erro||'Erro');reload();R()}
gate();shell('admin');const k=(a,b)=>`<div><small>${a}</small><b>${b}</b></div>`;
function setSt(id,v){const r=api('POST','/api/admin/status',{id,st:v});if(r.s!=200)alert(r.j.erro||'Erro');reload();R()}
function pg(id,v){const r=api('POST','/api/admin/pedido',{id,pago:v});if(r.s!=200)alert(r.j.erro||'Erro');reload();R()}
function vl(id){const p=DB.ped.find(x=>x.id==id),v=parseFloat((prompt('Novo valor do pedido (R$):',p.total)||'').replace(',','.'));if(v>=0){const r=api('POST','/api/admin/pedido',{id,total:v});if(r.s!=200)alert(r.j.erro||'Erro');reload();R()}}
function adj(id,n){const r=api('POST','/api/admin/estoque',{id,n});if(r.s!=200)alert(r.j.erro||'Erro');reload();R()}
function rep(id){const m=DB.mat.find(x=>x.id==id),q=parseFloat((prompt(`Quantos kg de ${m.nome} entraram?`)||'').replace(',','.'));if(q>0){const r=api('POST','/api/admin/material',{id,kg:q});if(r.s!=200)alert(r.j.erro||'Erro');reload();R()}}
function R(){$('#imp').hidden=!!(DB.imp&&DB.imp.includes('oficina3d'));const o=DB.ped.filter(p=>!['Entregue','Cancelado'].includes(p.st));
$('#k').innerHTML=k('Pedidos em aberto',o.length)+k('A receber',brl(DB.ped.filter(p=>!p.pago&&p.st!='Cancelado').reduce((s,p)=>s+p.total,0)))+k('Alertas de estoque',DB.prod.filter(p=>p.id!=8&&p.est<=5).length+DB.mat.filter(m=>m.qtd<=m.min).length);
$('#tp').innerHTML=DB.ped.slice().reverse().map(p=>`<tr><td>${p.id}</td><td>${esc(p.cli)}${p.tel?`<br><a href="https://wa.me/${p.tel.length<=11?'55'+p.tel:p.tel}" target="_blank" rel="noopener">${esc(p.tel)}</a>`:''}<br><small>${p.d}</small></td><td>${esc(p.desc)}</td><td>${p.prazo?p.prazo.split('-').reverse().join('/'):''}${p.prazo&&p.prazo<today()&&!['Entregue','Cancelado'].includes(p.st)?' <span class="lo">atrasado</span>':''}</td><td>${brl(p.total)}<br><label title="Só pedidos pagos entram no financeiro" style="font-size:12px"><input type="checkbox" ${p.pago?'checked':''} onchange="pg(${p.id},this.checked)" style="width:auto"> Pago</label><br><button onclick="vl(${p.id})">Valor</button></td><td><select style="border:2px solid ${SC[p.st]}" onchange="setSt(${p.id},this.value)" aria-label="Status do pedido ${p.id}">${ST.map(s=>`<option${s==p.st?' selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
$('#tl').innerHTML=DB.prod.filter(p=>p.id!=8).map(p=>`<tr><td>${esc(p.nome)}</td><td class="${p.est<=5?'lo':''}">${p.est}</td><td><button onclick="adj(${p.id},-1)" aria-label="Diminuir">−</button> <button onclick="adj(${p.id},1)" aria-label="Aumentar">+</button> <button onclick="adj(${p.id},10)">+10</button></td></tr>`).join('');
$('#tm').innerHTML=DB.mat.map(m=>`<tr><td>${esc(m.nome)}</td><td class="${m.qtd<=m.min?'lo':''}">${m.qtd}</td><td>${m.min}</td><td><button onclick="rep(${m.id})">Registrar compra</button></td></tr>`).join('')}R();watchOrders(R)</script></body></html>
