<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Gráfica3D · Admin</title><script src="shared.js"></script></head><body><main>
<h1>Painel administrativo</h1><div class="k" id="k"></div>
<h2>Pedidos</h2><div class="card w"><table><thead><tr><th>#</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th></tr></thead><tbody id="tp"></tbody></table></div>
<h2>Estoque da loja</h2><div class="card w"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Ajustar</th></tr></thead><tbody id="tl"></tbody></table></div>
<h2>Estoque de material</h2><div class="card w"><table><thead><tr><th>Material</th><th>Saldo (kg)</th><th>Mínimo</th><th>Reposição</th></tr></thead><tbody id="tm"></tbody></table></div></main>
<script>gate();shell('admin');const k=(a,b)=>`<div><small>${a}</small><b>${b}</b></div>`;
function setSt(id,v){const p=DB.ped.find(x=>x.id==id);p.st=v;if(v=='Entregue'&&!p.fin){p.fin=1;DB.fin.push({d:today(),t:'receita',c:'Vendas',x:'Pedido #'+id,v:p.total})}save();R()}
function adj(id,n){const p=DB.prod.find(x=>x.id==id);p.est=Math.max(0,p.est+n);save();R()}
function rep(id){const m=DB.mat.find(x=>x.id==id),q=parseFloat((prompt(`Quantos kg de ${m.nome} entraram?`)||'').replace(',','.'));if(q>0){m.qtd=+(m.qtd+q).toFixed(2);DB.fin.push({d:today(),t:'gasto',c:'Material',x:'Reposição '+m.nome,v:+(q*m.custo).toFixed(2)});save();R()}}
function R(){const o=DB.ped.filter(p=>!['Entregue','Cancelado'].includes(p.st));
$('#k').innerHTML=k('Pedidos em aberto',o.length)+k('A receber',brl(o.reduce((s,p)=>s+p.total,0)))+k('Alertas de estoque',DB.prod.filter(p=>p.id!=8&&p.est<=5).length+DB.mat.filter(m=>m.qtd<=m.min).length);
$('#tp').innerHTML=DB.ped.slice().reverse().map(p=>`<tr><td>${p.id}</td><td>${esc(p.cli)}<br><small>${p.d}</small></td><td>${esc(p.desc)}</td><td>${brl(p.total)}</td><td><select style="border:2px solid ${SC[p.st]}" onchange="setSt(${p.id},this.value)" aria-label="Status do pedido ${p.id}">${ST.map(s=>`<option${s==p.st?' selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
$('#tl').innerHTML=DB.prod.filter(p=>p.id!=8).map(p=>`<tr><td>${esc(p.nome)}</td><td class="${p.est<=5?'lo':''}">${p.est}</td><td><button onclick="adj(${p.id},-1)" aria-label="Diminuir">−</button> <button onclick="adj(${p.id},1)" aria-label="Aumentar">+</button> <button onclick="adj(${p.id},10)">+10</button></td></tr>`).join('');
$('#tm').innerHTML=DB.mat.map(m=>`<tr><td>${esc(m.nome)}</td><td class="${m.qtd<=m.min?'lo':''}">${m.qtd}</td><td>${m.min}</td><td><button onclick="rep(${m.id})">Registrar compra</button></td></tr>`).join('')}R()</script></body></html>
